apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-api
  namespace: opspilot-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opspilot-api
  template:
    metadata:
      labels:
        app: opspilot-api
    spec:
      containers:
        - name: opspilot-api
          image: opspilot-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MCP_SERVER_URL
              value: "http://opspilot-mcp:8001/mcp"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
