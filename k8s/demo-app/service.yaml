apiVersion: v1
kind: Service
metadata:
  name: opspilot-demo
  namespace: opspilot-lab
  labels:
    app.kubernetes.io/name: opspilot-demo
    app.kubernetes.io/part-of: opspilot

spec:
  type: ClusterIP

  selector:
    app: opspilot-demo

  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP