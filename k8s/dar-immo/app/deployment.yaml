
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dar-immo-app
  namespace: opspilot-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dar-immo-app
  template:
    metadata:
      labels:
        app: dar-immo-app
    spec:
      nodeSelector:
        kubernetes.io/hostname: opspilot-worker2
      containers:
        - name: dar-immo-app
          image: dar-immo:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
