# Dedicated ServiceAccount used ONLY by the (future, S2) MCP collection server.
# Nothing else in OpsPilot authenticates to the cluster (spec §6.3 SEC-01).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot-mcp
  namespace: opspilot-lab
  labels:
    app.kubernetes.io/part-of: opspilot
    app.kubernetes.io/component: collection
