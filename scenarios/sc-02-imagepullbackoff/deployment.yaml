# SC-02 ImagePullBackOff — demo deployment (spec §10.6 row 2).
#
# Reproducibility decision (documented per CONTRIBUTING "decisions in PR",
# reviewed as part of the initialization commit):
#   imagePullPolicy: Never + a tag that was never built/loaded means the kubelet
#   checks local containerd images only and reports ErrImagePull, then cycles
#   ImagePullBackOff — WITHOUT any registry or network dependency. This keeps the
#   scenario reproducible offline, which the spec values (NFR-02/§20.5).
#   A network variant (nonexistent tag on a real registry) is possible but adds
#   a network dependency; do not switch without team review.
#
# Expected (to be OBSERVED, never assumed — spec §10.6):
#   - events: reason ErrImagePull / ImagePullBackOff, type Warning/Failed,
#     bound to this Pod UID, with firstTimestamp/lastTimestamp/count (spec §9.2)
#   - NO application logs: the container never starts. Absence of logs is the
#     normal case here (absence ne justifie pas d'inventer une cause).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-sc02-imagepull
  namespace: opspilot-lab
  labels:
    app.kubernetes.io/name: opspilot-demo
    app.kubernetes.io/part-of: opspilot
    opspilot.io/scenario: SC-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opspilot-demo
      opspilot.io/scenario: SC-02
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opspilot-demo
        app.kubernetes.io/part-of: opspilot
        opspilot.io/scenario: SC-02
    spec:
      restartPolicy: Always
      containers:
        - name: api
          # This tag is DELIBERATELY never built by scripts/build-load-demo-image.ps1
          image: opspilot/demo-app:s2-tag-never-built
          imagePullPolicy: Never
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
