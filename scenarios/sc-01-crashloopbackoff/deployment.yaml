# SC-01 CrashLoopBackOff — demo deployment (spec §10.6 row 1, §17.2 S1).
#
# Human-triggered by scripts/run-scenario.ps1 -Scenario SC-01.
# The container (demo-app SCENARIO=crashloop) logs its startup, waits 3 seconds
# and exits with code 1; restartPolicy: Always -> repeated restarts with
# back-off -> container state Waiting(reason=CrashLoopBackOff) while the POD
# phase usually stays "Running". This gap is a documented learning artifact
# (spec §9.3), not a bug in the manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-sc01-crashloop
  namespace: opspilot-lab
  labels:
    app.kubernetes.io/name: opspilot-demo
    app.kubernetes.io/part-of: opspilot
    opspilot.io/scenario: SC-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opspilot-demo
      opspilot.io/scenario: SC-01
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opspilot-demo
        app.kubernetes.io/part-of: opspilot
        opspilot.io/scenario: SC-01
    spec:
      restartPolicy: Always
      containers:
        - name: api
          image: opspilot/demo-app:s1          # must be loaded with kind load (S1-03)
          imagePullPolicy: IfNotPresent        # local image, no registry dependency
          env:
            - name: SCENARIO
              value: crashloop
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
          ports:
            - containerPort: 8080              # never reached in crashloop mode
